<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#gold)" stroke-width="6" stroke-opacity="0.4"/>
  
  <!-- Cosmic Zodiac Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ring)" stroke-width="3" stroke-opacity="0.6"/>
  
  <!-- Central Sudarshana / Kalachakra Wheel -->
  <g transform="translate(256, 256)">
    <!-- 12 Rays for 12 Rashis -->
    <g stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="-140" x2="0" y2="140"/>
      <line x1="-140" y1="0" x2="140" y2="0"/>
      <line x1="-99" y1="-99" x2="99" y2="99"/>
      <line x1="-99" y1="99" x2="99" y2="-99"/>
      <line x1="-121" y1="-70" x2="121" y2="70"/>
      <line x1="-70" y1="-121" x2="70" y2="121"/>
      <line x1="-121" y1="70" x2="121" y2="-70"/>
      <line x1="-70" y1="121" x2="70" y2="-121"/>
    </g>
    
    <!-- Central Dharma Core -->
    <circle cx="0" cy="0" r="54" fill="#0f172a" stroke="url(#gold)" stroke-width="6"/>
    <circle cx="0" cy="0" r="28" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="12" fill="#020617"/>
    
    <!-- Golden Orbiting Planets -->
    <circle cx="0" cy="-140" r="12" fill="#fbbf24"/>
    <circle cx="140" cy="0" r="10" fill="#38bdf8"/>
    <circle cx="0" cy="140" r="14" fill="#f43f5e"/>
    <circle cx="-140" cy="0" r="11" fill="#34d399"/>
  </g>
</svg>